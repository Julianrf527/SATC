# SATC - Nginx Reverse Proxy
# Imagen: nginx:alpine (sin WAF/ModSecurity)

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 50M;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Preservar %2F y otros caracteres codificados en URLs
    merge_slashes off;

    server {
        listen 8080;
        server_name localhost 192.168.254.222 192.168.254.33 satc.corpochivor.local;

        # Resolver de Docker para resolución dinámica
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Cabeceras de seguridad (no se heredan en locations que ya definen add_header propio)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.20.0.0/16;
            deny all;
        }

        # Rutas SPA de Infraccion -> frontend (evita colision con rutas API /infraction/*)
        location ~ ^/infraction/(manage|consult|alerts|assign_manage|reports)/?$ {
            # reports: SPA page (API calls go to /infraction/file/reports/...)
            set $frontend_host "frontend";
            proxy_pass http://$frontend_host:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # SSE - notification stream (requiere config especial)
        location = /users/notification/stream {
            set $api_gateway_host "api-gateway";
            proxy_pass http://$api_gateway_host:8000$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            proxy_connect_timeout 30s;

            chunked_transfer_encoding on;
            add_header X-Accel-Buffering no;
            add_header Cache-Control no-cache;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;

            proxy_next_upstream off;
        }

        # Rutas de API → api-gateway
        location ~ ^/(users|sanctioning|documents|infraction|involveds)/ {
            set $api_gateway_host "api-gateway";
            proxy_pass http://$api_gateway_host:8000$request_uri;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Desactivar buffering para permitir streaming de archivos
            proxy_buffering off;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Solo reintentar en errores de conexión, no en respuestas 5xx
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 1;
        }

        # Todo lo demás → frontend React (resolución dinámica via variable)
        location / {
            set $frontend_host "frontend";
            proxy_pass http://$frontend_host:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
