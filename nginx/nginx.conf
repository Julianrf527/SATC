# Nginx Reverse Proxy - Instancia única (1 contenedor × 6 workers via Gunicorn)

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "upstream: $upstream_addr"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;

    # Preservar %2F y otros caracteres codificados en URLs
    merge_slashes off;

    # Upstream: instancia única (6 workers internos via Gunicorn)
    upstream api_gateway_backend {
        server api-gateway:8000 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name localhost 192.168.254.222 192.168.254.33 satc.corpochivor.local;

        # Resolver de Docker para resolución dinámica de frontend
        resolver 127.0.0.11 valid=10s ipv6=off;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.20.0.0/16;
            deny all;
        }

        # Rutas de API → api-gateway
        location ~ ^/(users|sanctioning|documents)/ {
            proxy_pass http://api_gateway_backend$request_uri;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Desactivar buffering para permitir streaming de archivos
            proxy_buffering off;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Solo reintentar en errores de conexión, no en respuestas 5xx
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 1;
        }

        # Todo lo demás → frontend React (resolución dinámica via variable)
        location / {
            set $frontend_host "frontend";
            proxy_pass http://$frontend_host:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
