# ====================================
# SATC - Docker Compose PRODUCCIÓN
# Sin código fuente — solo imágenes
# ====================================
# Uso: docker compose -f docker-compose.yml up -d
# Requiere .env con REGISTRY y VERSION definidos
# ====================================

version: "3.8"

networks:
  satc-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-users-data:
    driver: local
  postgres-sanctioning-data:
    driver: local
  postgres-docs-data:
    driver: local
  minio-data:
    driver: local
  clamav-data:
    driver: local
  redis-data:
    driver: local
  backups:
    driver: local
  secure-uploads-sanctioning:
    driver: local
  secure-uploads-docs:
    driver: local

services:
  # ==========================================
  # BASE DE DATOS - PostgreSQL Users
  # ==========================================
  postgres-users:
    image: postgres:15-alpine
    container_name: satc-postgres-users
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Bogota
      PGTZ: America/Bogota
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 200M
        reservations:
          cpus: "0.5"
          memory: 100M
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=50MB"
      - "-c"
      - "effective_cache_size=150MB"
      - "-c"
      - "maintenance_work_mem=12MB"
      - "-c"
      - "work_mem=1MB"
    volumes:
      - postgres-users-data:/var/lib/postgresql/data
      - ./db-script/user_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backups/postgres-users:/backups
    networks:
      - satc-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # BASE DE DATOS - PostgreSQL Sanctioning
  # ==========================================
  postgres-sanctioning:
    image: postgres:15-alpine
    container_name: satc-postgres-sanctioning
    environment:
      POSTGRES_DB: expedientes_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Bogota
      PGTZ: America/Bogota
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 128M
        reservations:
          cpus: "1.0"
          memory: 64M
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=32MB"
      - "-c"
      - "effective_cache_size=96MB"
      - "-c"
      - "maintenance_work_mem=8MB"
      - "-c"
      - "work_mem=512kB"
    volumes:
      - postgres-sanctioning-data:/var/lib/postgresql/data
      - ./db-script/expedientes_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backups/postgres-sanctioning:/backups
    networks:
      - satc-network
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expedientes_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # BASE DE DATOS - PostgreSQL Docs
  # ==========================================
  postgres-docs:
    image: postgres:15-alpine
    container_name: satc-postgres-docs
    environment:
      POSTGRES_DB: documentos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Bogota
      PGTZ: America/Bogota
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 96M
        reservations:
          cpus: "0.75"
          memory: 48M
    command:
      - "postgres"
      - "-c"
      - "max_connections=250"
      - "-c"
      - "shared_buffers=24MB"
      - "-c"
      - "effective_cache_size=72MB"
      - "-c"
      - "maintenance_work_mem=6MB"
      - "-c"
      - "work_mem=512kB"
    volumes:
      - postgres-docs-data:/var/lib/postgresql/data
      - ./db-script/documentos_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backups/postgres-docs:/backups
    networks:
      - satc-network
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documentos_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # OBJECT STORAGE - MinIO
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: satc-minio
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 192M
        reservations:
          cpus: "1.0"
          memory: 96M
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: America/Bogota
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
      - ./backups/minio:/backups
    networks:
      - satc-network
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # ANTIVIRUS - ClamAV
  # ==========================================
  clamav:
    image: clamav/clamav:latest
    container_name: satc-clamav
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1400M
        reservations:
          cpus: "1.0"
          memory: 700M
    environment:
      TZ: America/Bogota
    networks:
      - satc-network
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 300s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # CACHE DISTRIBUIDO - Redis
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: satc-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 200mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.5"
          memory: 128M
    environment:
      TZ: America/Bogota
    networks:
      - satc-network
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # NGINX LOAD BALANCER
  # ==========================================
  nginx-lb:
    image: nginx:alpine
    container_name: satc-nginx-lb
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 128M
        reservations:
          cpus: "0.5"
          memory: 64M
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - satc-network
    ports:
      - "8000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: America/Bogota

  # ==========================================
  # MICROSERVICIO - Users
  # ==========================================
  app-users:
    image: ${REGISTRY}/satc-users:${VERSION:-latest} # ← imagen, no código
    container_name: satc-app-users
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 600M
        reservations:
          cpus: "1.0"
          memory: 200M
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres-users:5432/user_db
      REDIS_SESSIONS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB_SESSIONS: 1
      SECRET_KEY: ${SECRET_KEY}
      SECRET_KEY_GATEWAY: ${SECRET_KEY_GATEWAY}
      SECRET_GATEWAY: ${SECRET_GATEWAY}
      JWT_ALGORITHM: HS256
      JWT_EXP_DAYS: 1
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN}
      SMTP_FROM: ${SMTP_FROM}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PERMISO_ROL: ${PERMISO_ROL}
      PERMISO_USER: ${PERMISO_USER}
      GESTION_USER: ${GESTION_USER}
      USER_LOG: ${USER_LOG}
      TZ: America/Bogota
    depends_on:
      postgres-users:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - satc-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # MICROSERVICIO - Sanctioning
  # ==========================================
  app-sanctioning:
    image: ${REGISTRY}/satc-sanctioning:${VERSION:-latest} # ← imagen, no código
    container_name: satc-app-sanctioning
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 450M
        reservations:
          cpus: "1.0"
          memory: 225M
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres-sanctioning:5432/expedientes_db
      SECRET_GATEWAY: ${SECRET_GATEWAY}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: satc-expedientes
      MINIO_SECURE: "false"
      USER_SERVICE_URL: http://app-users:8001
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
      UPLOAD_DIR: /app/secure-uploads
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CORS_ORIGINS: ${CORS_ORIGINS}
      TZ: America/Bogota
    depends_on:
      postgres-sanctioning:
        condition: service_healthy
      minio:
        condition: service_healthy
      app-users:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - secure-uploads-sanctioning:/app/secure-uploads
    networks:
      - satc-network
    ports:
      - "8002:8002"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # MICROSERVICIO - Documents
  # ==========================================
  app-docs:
    image: ${REGISTRY}/satc-docs:${VERSION:-latest} # ← imagen, no código
    container_name: satc-app-docs
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.25"
          memory: 64M
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres-docs:5432/documentos_db
      SECRET_GATEWAY: ${SECRET_GATEWAY}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: satc-documentos
      MINIO_SECURE: "false"
      USER_SERVICE_URL: http://app-users:8001
      API_GATEWAY_URL: http://nginx-lb:80
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
      UPLOAD_DIR: /app/secure-uploads
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CORS_ORIGINS: ${CORS_ORIGINS}
      TZ: America/Bogota
    depends_on:
      postgres-docs:
        condition: service_healthy
      minio:
        condition: service_healthy
      app-users:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - secure-uploads-docs:/app/secure-uploads
    networks:
      - satc-network
    ports:
      - "8003:8003"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # API GATEWAY
  # ==========================================
  api-gateway:
    image: ${REGISTRY}/satc-gateway:${VERSION:-latest} # ← imagen, no código
    container_name: satc-api-gateway
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 900M
        reservations:
          cpus: "2.0"
          memory: 450M
    environment:
      SECRET_KEY_GATEWAY: ${SECRET_KEY_GATEWAY}
      SECRET_GATEWAY: ${SECRET_GATEWAY}
      JWT_ALGORITHM: HS256
      USER_ROUTE: http://app-users:8001
      SANCTIONING_ROUTE: http://app-sanctioning:8002
      DOCUMENTS_ROUTE: http://app-docs:8003
      CORS_ORIGINS: ${CORS_ORIGINS}
      CACHE_TYPE: ${CACHE_TYPE:-redis}
      CACHE_TTL: ${CACHE_TTL:-900}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_PER_MINUTE: 100
      TZ: America/Bogota
    depends_on:
      app-users:
        condition: service_healthy
      app-sanctioning:
        condition: service_healthy
      app-docs:
        condition: service_healthy
    networks:
      - satc-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # FRONTEND - React (compilado, sin fuentes)
  # ==========================================
  frontend:
    image: ${REGISTRY}/satc-frontend:${VERSION:-latest} # ← imagen, no código
    container_name: satc-frontend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
        reservations:
          cpus: "0.25"
          memory: 32M
    environment:
      VITE_API_URL: ${FRONTEND_API_URL}
      TZ: America/Bogota
    networks:
      - satc-network
    ports:
      - "80:80"
    depends_on:
      nginx-lb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # BACKUP SERVICE (Disaster Recovery)
  # Backups automáticos cada 30 minutos
  # ==========================================
  backup-service:
    image: postgres:15-alpine
    container_name: satc-backup-service
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.25"
          memory: 64M
    environment:
      TZ: America/Bogota
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-all.sh:/backup-all.sh:ro
      - ./scripts/setup-cron-backup.sh:/setup-cron-backup.sh:ro
    networks:
      - satc-network
    entrypoint: ["sh", "/setup-cron-backup.sh"]
    depends_on:
      postgres-users:
        condition: service_healthy
      postgres-sanctioning:
        condition: service_healthy
      postgres-docs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/log/backup-cron.log || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
