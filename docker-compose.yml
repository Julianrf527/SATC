# ====================================
# SATC - Sistema ApiCorp
# Docker Compose - Producción
# ====================================
# Changelog:
# - 2026-02-13: Configuración inicial con mejoras de arquitectura
# - Timezone: America/Bogota en todos los servicios
# - Healthchecks y restart policies configurados
# - Volúmenes persistentes para datos y backups
# - Network aislada para comunicación interna
# ====================================

version: "3.8"

# ============================================
# NETWORKS
# ============================================
networks:
  satc-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================
# VOLUMES
# ============================================
volumes:
  # Bases de datos
  postgres-users-data:
    driver: local
  postgres-sanctioning-data:
    driver: local
  postgres-docs-data:
    driver: local

  # MinIO Storage
  minio-data:
    driver: local

  # ClamAV virus definitions (Caso 8)
  clamav-data:
    driver: local

  # Redis cache (Caso 4: Cache distribuido - Opcional)
  redis-data:
    driver: local

  # Backups (Caso 11: Disaster Recovery)
  backups:
    driver: local

  # Uploads seguros (Caso 8: Seguridad archivos)
  secure-uploads-sanctioning:
    driver: local
  secure-uploads-docs:
    driver: local

# ============================================
# SERVICES
# ============================================
services:
  # ==========================================
  # BASE DE DATOS - PostgreSQL Users
  # ==========================================
  postgres-users:
    image: postgres:15-alpine
    container_name: satc-postgres-users
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: America/Bogota
      PGTZ: America/Bogota
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 200M
        reservations:
          cpus: "0.5"
          memory: 100M
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=50MB"
      - "-c"
      - "effective_cache_size=150MB"
      - "-c"
      - "maintenance_work_mem=12MB"
      - "-c"
      - "work_mem=1MB"
    volumes:
      - postgres-users-data:/var/lib/postgresql/data
      - ./db-script/user_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backups/postgres-users:/backups
    networks:
      - satc-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # BASE DE DATOS - PostgreSQL Sanctioning
  # ==========================================
  postgres-sanctioning:
    image: postgres:15-alpine
    container_name: satc-postgres-sanctioning
    environment:
      POSTGRES_DB: expedientes_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: America/Bogota
      PGTZ: America/Bogota
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 128M
        reservations:
          cpus: "1.0"
          memory: 64M
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=32MB"
      - "-c"
      - "effective_cache_size=96MB"
      - "-c"
      - "maintenance_work_mem=8MB"
      - "-c"
      - "work_mem=512kB"
    volumes:
      - postgres-sanctioning-data:/var/lib/postgresql/data
      - ./db-script/expedientes_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backups/postgres-sanctioning:/backups
    networks:
      - satc-network
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expedientes_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # BASE DE DATOS - PostgreSQL Docs
  # ==========================================
  postgres-docs:
    image: postgres:15-alpine
    container_name: satc-postgres-docs
    environment:
      POSTGRES_DB: documentos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: America/Bogota
      PGTZ: America/Bogota
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 96M
        reservations:
          cpus: "0.75"
          memory: 48M
    command:
      - "postgres"
      - "-c"
      - "max_connections=250"
      - "-c"
      - "shared_buffers=24MB"
      - "-c"
      - "effective_cache_size=72MB"
      - "-c"
      - "maintenance_work_mem=6MB"
      - "-c"
      - "work_mem=512kB"
    volumes:
      - postgres-docs-data:/var/lib/postgresql/data
      - ./db-script/documentos_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backups/postgres-docs:/backups
    networks:
      - satc-network
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documentos_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # OBJECT STORAGE - MinIO
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: satc-minio
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 192M
        reservations:
          cpus: "1.0"
          memory: 96M
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      TZ: America/Bogota
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
      - ./backups/minio:/backups
    networks:
      - satc-network
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # ANTIVIRUS - ClamAV (Caso 8: Seguridad)
  # ==========================================
  clamav:
    image: clamav/clamav:latest
    container_name: satc-clamav
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1400M
        reservations:
          cpus: "1.0"
          memory: 700M
    environment:
      TZ: America/Bogota
    networks:
      - satc-network
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 300s # ClamAV tarda en actualizar definiciones
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # CACHE DISTRIBUIDO - Redis (Caso 4: Opcional)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: satc-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password} --maxmemory 200mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.5"
          memory: 128M
    environment:
      TZ: America/Bogota
    networks:
      - satc-network
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Redis SIEMPRE activo para sesiones (Optimización de performance)

  # ==========================================
  # NGINX LOAD BALANCER
  # ==========================================
  nginx-lb:
    image: nginx:alpine
    container_name: satc-nginx-lb
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 128M
        reservations:
          cpus: "0.5"
          memory: 64M
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - satc-network
    ports:
      - "8000:80"
    depends_on:
      api-gateway-1:
        condition: service_healthy
      api-gateway-2:
        condition: service_healthy
      api-gateway-3:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: America/Bogota

  # ==========================================
  # MICROSERVICIO - Users (Replica 1)
  # ==========================================
  app-users-1:
    build:
      context: ./app-users
      dockerfile: Dockerfile
    container_name: satc-app-users-1
    deploy:
      resources:
        limits:
          cpus: "1.0" # Aumentado para 4 workers (antes 0.75 para 2 workers)
          memory: 400M # Optimizado según uso real: 296MB pico
        reservations:
          cpus: "0.5"
          memory: 200M
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres-users:5432/user_db

      # Redis Sessions (Optimización: 96% más rápido que PostgreSQL)
      REDIS_SESSIONS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      REDIS_DB_SESSIONS: 1

      # JWT
      SECRET_KEY: ${SECRET_KEY}
      SECRET_KEY_GATEWAY: ${SECRET_KEY_GATEWAY}
      SECRET_GATEWAY: ${SECRET_GATEWAY}
      JWT_ALGORITHM: HS256
      JWT_EXP_DAYS: 1

      # Email
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}

      # Permisos
      PERMISO_ROL: ${PERMISO_ROL:-admin_roles y permisos}
      PERMISO_USER: ${PERMISO_USER:-admin_registrar usuario}
      GESTION_USER: ${GESTION_USER:-admin_gestionar usuarios}
      USER_LOG: ${USER_LOG:-admin_auditoria usuarios}

      # Timezone
      TZ: America/Bogota
    depends_on:
      postgres-users:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - satc-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # MICROSERVICIO - Users (Replica 2)
  # ==========================================
  app-users-2:
    build:
      context: ./app-users
      dockerfile: Dockerfile
    container_name: satc-app-users-2
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 400M
        reservations:
          cpus: "0.5"
          memory: 200M
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres-users:5432/user_db

      # Redis Sessions (Optimización: 96% más rápido que PostgreSQL)
      REDIS_SESSIONS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      REDIS_DB_SESSIONS: 1

      # JWT
      SECRET_KEY: ${SECRET_KEY}
      SECRET_KEY_GATEWAY: ${SECRET_KEY_GATEWAY}
      SECRET_GATEWAY: ${SECRET_GATEWAY}
      JWT_ALGORITHM: HS256
      JWT_EXP_DAYS: 1

      # Email
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}

      # Permisos
      PERMISO_ROL: ${PERMISO_ROL:-admin_roles y permisos}
      PERMISO_USER: ${PERMISO_USER:-admin_registrar usuario}
      GESTION_USER: ${GESTION_USER:-admin_gestionar usuarios}
      USER_LOG: ${USER_LOG:-admin_auditoria usuarios}

      # Timezone
      TZ: America/Bogota
    depends_on:
      postgres-users:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - satc-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # MICROSERVICIO - Users (Replica 3) - DESHABILITADO
  # Configuración ajustada para 30 usuarios: Solo 2 réplicas necesarias
  # ==========================================
  # app-users-3:
  #   build:
  #     context: ./app-users
  #     dockerfile: Dockerfile
  #   container_name: satc-app-users-3
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "1.0"
  #         memory: 400M
  #       reservations:
  #         cpus: "0.5"
  #         memory: 200M
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres-users:5432/user_db
  #     REDIS_SESSIONS_ENABLED: "true"
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379
  #     REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
  #     REDIS_DB_SESSIONS: 1
  #     SECRET_KEY: ${SECRET_KEY}
  #     SECRET_KEY_GATEWAY: ${SECRET_KEY_GATEWAY}
  #     SECRET_GATEWAY: ${SECRET_GATEWAY}
  #     JWT_ALGORITHM: HS256
  #     JWT_EXP_DAYS: 1
  #     SMTP_SERVER: ${SMTP_SERVER}
  #     SMTP_PORT: ${SMTP_PORT:-587}
  #     SMTP_USERNAME: ${SMTP_USERNAME}
  #     SMTP_PASSWORD: ${SMTP_PASSWORD}
  #     SMTP_FROM: ${SMTP_FROM}
  #     CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
  #     PERMISO_ROL: ${PERMISO_ROL:-admin_roles y permisos}
  #     PERMISO_USER: ${PERMISO_USER:-admin_registrar usuario}
  #     GESTION_USER: ${GESTION_USER:-admin_gestionar usuarios}
  #     USER_LOG: ${USER_LOG:-admin_auditoria usuarios}
  #     TZ: America/Bogota
  #   depends_on:
  #     postgres-users:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - satc-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 10s
  #   restart: unless-stopped
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

  # ==========================================
  # MICROSERVICIO - Sanctioning
  # ==========================================
  app-sanctioning:
    build:
      context: ./app-sancionatoria
      dockerfile: Dockerfile
    container_name: satc-app-sanctioning
    deploy:
      resources:
        limits:
          cpus: "1.0" # Reducido de 1.5 (2 workers)
          memory: 256M # Optimizado según uso real: 187MB pico
        reservations:
          cpus: "0.5"
          memory: 128M
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres-sanctioning:5432/expedientes_db

      # JWT
      SECRET_GATEWAY: ${SECRET_GATEWAY}

      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: satc-expedientes
      MINIO_SECURE: "false"

      # Services URLs
      USER_SERVICE_URL: http://app-users-1:8001

      # File Security (Caso 8)
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
      UPLOAD_DIR: /app/secure-uploads

      # ClamAV Antivirus
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}

      # Timezone
      TZ: America/Bogota
    depends_on:
      postgres-sanctioning:
        condition: service_healthy
      minio:
        condition: service_healthy
      app-users-1:
        condition: service_healthy
      app-users-2:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - secure-uploads-sanctioning:/app/secure-uploads
    networks:
      - satc-network
    ports:
      - "8002:8002"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # MICROSERVICIO - Sanctioning (Replica 2)
  # Alta disponibilidad para servicio crítico - Sin port mapping
  # ==========================================
  app-sanctioning-2:
    build:
      context: ./app-sancionatoria
      dockerfile: Dockerfile
    container_name: satc-app-sanctioning-2
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.5"
          memory: 128M
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres-sanctioning:5432/expedientes_db

      # JWT
      SECRET_GATEWAY: ${SECRET_GATEWAY}

      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: satc-expedientes
      MINIO_SECURE: "false"

      # Services URLs
      USER_SERVICE_URL: http://app-users-1:8001

      # File Security (Caso 8)
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
      UPLOAD_DIR: /app/secure-uploads

      # ClamAV Antivirus
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}

      # Timezone
      TZ: America/Bogota
    depends_on:
      postgres-sanctioning:
        condition: service_healthy
      minio:
        condition: service_healthy
      app-users-1:
        condition: service_healthy
      app-users-2:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - secure-uploads-sanctioning:/app/secure-uploads
    networks:
      - satc-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # MICROSERVICIO - Documents
  # ==========================================
  app-docs:
    build:
      context: ./app-docs
      dockerfile: Dockerfile
    container_name: satc-app-docs
    deploy:
      resources:
        limits:
          cpus: "0.5" # Reducido de 1.0 (1 worker)
          memory: 128M # Optimizado según uso real: 89MB pico
        reservations:
          cpus: "0.25"
          memory: 64M
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres-docs:5432/documentos_db

      # JWT
      SECRET_GATEWAY: ${SECRET_GATEWAY}

      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: satc-documentos
      MINIO_SECURE: "false"

      # Services URLs
      USER_SERVICE_URL: http://app-users-1:8001
      API_GATEWAY_URL: http://nginx-lb:80

      # File Security (Caso 8)
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
      UPLOAD_DIR: /app/secure-uploads

      # ClamAV Antivirus
      CLAMAV_ENABLED: ${CLAMAV_ENABLED:-true}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}

      # Timezone
      TZ: America/Bogota
    depends_on:
      postgres-docs:
        condition: service_healthy
      minio:
        condition: service_healthy
      app-users-1:
        condition: service_healthy
      app-users-2:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - secure-uploads-docs:/app/secure-uploads
    networks:
      - satc-network
    ports:
      - "8003:8003"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # API GATEWAY (Replica 1)
  # ==========================================
  api-gateway-1:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: satc-api-gateway-1
    deploy:
      resources:
        limits:
          cpus: "1.5" # Aumentado para 6 workers (antes 1.0 para 4 workers)
          memory: 384M # Optimizado según uso real: 291MB pico
        reservations:
          cpus: "0.75"
          memory: 192M
    environment:
      # JWT
      SECRET_KEY_GATEWAY: ${SECRET_KEY_GATEWAY}
      SECRET_GATEWAY: ${SECRET_GATEWAY}
