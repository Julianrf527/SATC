      # Services Routes
      USER_ROUTE: http://app-users-1:8001
      SANCTIONING_ROUTE: http://app-sanctioning:8002
      DOCUMENTS_ROUTE: http://app-docs:8003

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}

      # Timezone
      TZ: America/Bogota

      # Cache Distribuido (Caso 4)
      CACHE_TYPE: ${CACHE_TYPE:-local} # local, redis, none
      CACHE_TTL: ${CACHE_TTL:-900} # 15 minutos (para pruebas de carga)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}

      # Rate Limiting (Caso 12)
      RATE_LIMIT_ENABLED: "true"
