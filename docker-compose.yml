        max-file: "3"

  # ==========================================
  # FRONTEND - React + Nginx
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: satc-frontend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
        reservations:
          cpus: "0.25"
          memory: 32M
    environment:
      # URL del API Gateway (inyectada en runtime)
      VITE_API_URL: ${FRONTEND_API_URL:-http://localhost:8000}
      TZ: America/Bogota
    networks:
      - satc-network
    ports:
      - "80:80"
    depends_on:
      nginx-lb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # BACKUP SERVICE (Caso 11: Disaster Recovery)
  # ==========================================
  backup-service:
    image: postgres:15-alpine
    container_name: satc-backup-service
    environment:
      TZ: America/Bogota
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-all.sh:/backup-all.sh:ro
    networks:
      - satc-network
    entrypoint: ["sh", "-c", "while true; do sleep 86400; done"]
    depends_on:
      - postgres-users
      - postgres-sanctioning
      - postgres-docs
    restart: unless-stopped
    profiles:
      - backup

# ==========================================
# CONFIGURACIONES ADICIONALES
# ==========================================
# Para ejecutar backup manual:
#   docker-compose exec backup-service sh /backup-all.sh
#
# Para ver logs:
#   docker-compose logs -f [service-name]
#
# Para aplicar migraciones:
#   docker-compose exec app-users python scripts/seed_database.py
